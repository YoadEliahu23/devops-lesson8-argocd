apiVersion: v1
kind: ConfigMap
metadata:
  name: my-website-config
  namespace: student-apps
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>GitOps Demo</title></head>
    <body style="background-color: #2d3436; color: white; text-align: center; padding-top: 50px;">
      <h1>Hello Class 1125!</h1>
      <p>Deployed via ArgoCD</p>
    </body>
    </html>
---
apiVersion: v1
kind: Service
metadata:
  name: my-app-service
  namespace: student-apps
spec:
  selector:
    app: my-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: student-apps
  labels:
    app: my-app
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: my-app
  template:
    metadata: 
      labels:
        app: my-app  
    spec: 
      containers:
        - name: my-app-container
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: my-website-config
              mountPath: /usr/share/nginx/html
      volumes:
        - name: my-website-config
          configMap:
            name: my-website-config
